name: 使用问题
description: 反馈对话流程、安装、链接或输出中的具体问题。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请优先使用虚构数据复现，不要上传个人健康记录、身体照片、私人方案、密钥或完整聊天。"
  - type: input
    id: environment
    attributes:
      label: 使用环境与版本
      description: 使用哪个智能体或客户端？Skill版本是什么？不知道的部分可以留空。
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: 怎样出现这个问题
      description: 提供最短的输入和操作步骤，涉及个人信息时请改成虚构资料。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么
      description: 可附去掉私人信息后的少量回答或失效链接。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你希望怎样处理
    validations:
      required: false
