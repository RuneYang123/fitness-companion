<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 448" width="100%" height="100%">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>

    <linearGradient id="brandGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="darkBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="userBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="biliGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <!-- Decorative Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#10B981" fill-opacity="0.14" />
    </pattern>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* Icon Dumbbell Lift Animation */
    .dumbbell-lift {
      animation: liftRep 3s ease-in-out infinite;
      transform-origin: 62px 62px;
    }
    @keyframes liftRep {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      40% { transform: translateY(-2.5px) rotate(-2deg); }
      60% { transform: translateY(-2.5px) rotate(2deg); }
    }

    /* Pulse Dot */
    .status-dot {
      animation: pulseDot 2s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* 18-Second 3-Scene Master Loop (6s per scene for comfortable reading) */
    .scene-1 { animation: scene1Anim 18s infinite; }
    .scene-2 { animation: scene2Anim 18s infinite; }
    .scene-3 { animation: scene3Anim 18s infinite; }

    @keyframes scene1Anim {
      0% { opacity: 0; transform: translateY(8px); }
      3%, 30% { opacity: 1; transform: translateY(0px); }
      33.33%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes scene2Anim {
      0%, 33.33% { opacity: 0; transform: translateY(8px); }
      36.33%, 63.33% { opacity: 1; transform: translateY(0px); }
      66.66%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes scene3Anim {
      0%, 66.66% { opacity: 0; transform: translateY(8px); }
      69.66%, 96.66% { opacity: 1; transform: translateY(0px); }
      100% { opacity: 0; transform: translateY(-6px); }
    }

    /* Delayed Card Entrance per Scene */
    .card-1 { animation: card1Anim 18s infinite; }
    .card-2 { animation: card2Anim 18s infinite; }
    .card-3 { animation: card3Anim 18s infinite; }

    @keyframes card1Anim {
      0%, 2.5% { opacity: 0; transform: translateY(12px); }
      6%, 30% { opacity: 1; transform: translateY(0px); }
      33.33%, 100% { opacity: 0; transform: translateY(-5px); }
    }
    @keyframes card2Anim {
      0%, 35.83% { opacity: 0; transform: translateY(12px); }
      39.33%, 63.33% { opacity: 1; transform: translateY(0px); }
      66.66%, 100% { opacity: 0; transform: translateY(-5px); }
    }
    @keyframes card3Anim {
      0%, 69.16% { opacity: 0; transform: translateY(12px); }
      72.66%, 96.66% { opacity: 1; transform: translateY(0px); }
      100% { opacity: 0; transform: translateY(-5px); }
    }

    /* Left Navigation Highlight Sync */
    .tab-1 { animation: tab1Highlight 18s infinite; }
    .tab-2 { animation: tab2Highlight 18s infinite; }
    .tab-3 { animation: tab3Highlight 18s infinite; }

    @keyframes tab1Highlight {
      0%, 32% { fill: #ECFDF5; stroke: #10B981; stroke-width: 1.8; }
      33.33%, 100% { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
    }
    @keyframes tab2Highlight {
      0%, 33.32% { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      33.33%, 65.33% { fill: #ECFDF5; stroke: #10B981; stroke-width: 1.8; }
      66.66%, 100% { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
    }
    @keyframes tab3Highlight {
      0%, 66.65% { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      66.66%, 98.66% { fill: #ECFDF5; stroke: #10B981; stroke-width: 1.8; }
      100% { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
    }

    /* Progress Bar Fill Animation */
    .progress-bar {
      animation: progressFill 18s linear infinite;
    }
    @keyframes progressFill {
      0% { width: 0px; }
      33.33% { width: 170px; }
      66.66% { width: 340px; }
      100% { width: 510px; }
    }
  </style>

  <!-- Main Outer Container -->
  <rect x="1" y="1" width="918" height="446" rx="20" fill="url(#bgGrad)" stroke="#A7F3D0" stroke-width="1.5" />
  <rect x="1" y="1" width="918" height="446" rx="20" fill="url(#dotGrid)" />

  <!-- ==========================================
       LEFT PANEL: BRAND, PAIN-POINT HOOK & TABS
       ========================================== -->
  <g class="font-sans">
    <!-- App Icon -->
    <g>
      <rect x="30" y="32" width="60" height="60" rx="15" fill="#047857" fill-opacity="0.16" />
      <rect x="30" y="28" width="60" height="60" rx="15" fill="url(#brandGreen)" />
      <!-- White Speech Bubble -->
      <path d="M 60 39 C 46.5 39 38 47 38 57.5 C 38 62.5 40.5 67 44.5 70 L 42 77.5 L 50.5 73.5 C 53.5 74.5 56.7 75 60 75 C 73.5 75 82 67 82 57 C 82 47 73.5 39 60 39 Z"
            fill="none" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Animated Dumbbell Inside Bubble -->
      <g class="dumbbell-lift" fill="#FFFFFF">
        <rect x="52.5" y="55.5" width="15" height="3.8" rx="1.4" />
        <rect x="48.5" y="50" width="5.2" height="15" rx="2" />
        <rect x="66.3" y="50" width="5.2" height="15" rx="2" />
        <rect x="44.5" y="52.2" width="3.2" height="10.5" rx="1.4" />
        <rect x="72.3" y="52.2" width="3.2" height="10.5" rx="1.4" />
      </g>
    </g>

    <!-- Title & Subtitle -->
    <text x="102" y="54" font-size="21" font-weight="800" fill="#0F172A">练得明白</text>
    <rect x="192" y="38" width="130" height="20" rx="6" fill="url(#darkBadge)" />
    <text x="257" y="52" text-anchor="middle" font-size="10.5" font-weight="700" fill="#34D399" class="font-mono">23份动作教学卡</text>
    <text x="102" y="76" font-size="12.5" font-weight="700" fill="#059669" class="font-mono">Fitness Companion · Agent Skill</text>

    <!-- Value Hook Box -->
    <rect x="30" y="102" width="292" height="48" rx="10" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.2" />
    <text x="42" y="122" font-size="12.5" font-weight="700" fill="#0F172A">告别收藏夹碎片干货与三千字死板模板</text>
    <text x="42" y="140" font-size="11.5" fill="#475569">复制一句话让智能体自动安装 · 一步步盘清计划</text>

    <!-- 3 Synchronized Scene Tabs -->
    <!-- Tab 1 -->
    <g>
      <rect class="tab-1" x="30" y="162" width="292" height="64" rx="12" />
      <circle cx="52" cy="194" r="12" fill="#10B981" fill-opacity="0.14" />
      <text x="52" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#047857" class="font-mono">01</text>
      <text x="74" y="188" font-size="13.5" font-weight="700" fill="#0F172A">一步步盘训练 · 18项原片直达</text>
      <text x="74" y="208" font-size="11.5" fill="#64748B">无热身不训练 · 谭成义B站核对到秒 + 搜索兜底</text>
    </g>

    <!-- Tab 2 -->
    <g>
      <rect class="tab-2" x="30" y="236" width="292" height="64" rx="12" />
      <circle cx="52" cy="268" r="12" fill="#10B981" fill-opacity="0.14" />
      <text x="52" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#047857" class="font-mono">02</text>
      <text x="74" y="262" font-size="13.5" font-weight="700" fill="#0F172A">懂中餐与外卖 · 补剂三层做减法</text>
      <text x="74" y="282" font-size="11.5" fill="#64748B">生熟米肉换算 · 拍盒饭粗评 · 允许“无必补项”</text>
    </g>

    <!-- Tab 3 -->
    <g>
      <rect class="tab-3" x="30" y="310" width="292" height="64" rx="12" />
      <circle cx="52" cy="342" r="12" fill="#10B981" fill-opacity="0.14" />
      <text x="52" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#047857" class="font-mono">03</text>
      <text x="74" y="336" font-size="13.5" font-weight="700" fill="#0F172A">睡眠恢复 · 加班应变 · 跨会话接续</text>
      <text x="74" y="356" font-size="11.5" fill="#64748B">半小时保底计划 · 零打卡焦虑 · 换聊天接着练</text>
    </g>

    <!-- Bottom Motto Pill -->
    <rect x="30" y="388" width="292" height="32" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="176" y="408" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">“最佳的锻炼年份和月份？答案只有一个：就是现在。”</text>
  </g>

  <!-- ==========================================
       RIGHT PANEL: LIVE AGENT CONVERSATION WINDOW
       ========================================== -->
  <g class="font-sans">
    <!-- Crisp Vector Window Shadow & Frame -->
    <rect x="348" y="28" width="544" height="396" rx="16" fill="#0F172A" fill-opacity="0.06" />
    <rect x="346" y="24" width="544" height="396" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Window Header Bar -->
    <path d="M 346 40 Q 346 24 362 24 L 874 24 Q 890 24 890 40 L 890 66 L 346 66 Z" fill="#F8FAFC" />
    <line x1="346" y1="66" x2="890" y2="66" stroke="#E2E8F0" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="368" cy="45" r="5.5" fill="#FCA5A5" />
    <circle cx="386" cy="45" r="5.5" fill="#FCD34D" />
    <circle cx="404" cy="45" r="5.5" fill="#6EE7B7" />

    <!-- Active Skill Pill in Header (Universal Agent style, no $codex binding) -->
    <rect x="428" y="33" width="246" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <circle class="status-dot" cx="443" cy="45" r="4" fill="#10B981" />
    <text x="454" y="49" font-size="11.5" font-weight="700" fill="#065F46" class="font-mono">fitness-companion</text>
    <text x="582" y="49" font-size="11" font-weight="600" fill="#059669">· 智能体已加载</text>

    <text x="872" y="49" text-anchor="end" font-size="11" fill="#64748B" class="font-mono">Agent Skills · MIT</text>

    <!-- Progress Bar Track at Bottom of Window -->
    <rect x="364" y="406" width="510" height="4" rx="2" fill="#F1F5F9" />
    <rect class="progress-bar" x="364" y="406" width="170" height="4" rx="2" fill="#10B981" />

    <!-- ==========================================
         SCENE 1: SOLO TRAINING + 23 EXERCISE CARDS
         ========================================== -->
    <g class="scene-1">
      <!-- User Prompt Bubble -->
      <rect x="436" y="81" width="436" height="40" rx="14" fill="#047857" fill-opacity="0.14" />
      <rect x="434" y="78" width="436" height="40" rx="14" fill="url(#userBubbleGrad)" />
      <text x="452" y="103" font-size="12.5" font-weight="600" fill="#FFFFFF">“一个人去健身房、一周能练三天，怎么排？上斜哑铃卧推老晃？”</text>
    </g>

    <g class="card-1">
      <!-- Agent Response Card -->
      <rect x="366" y="130" width="504" height="264" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />

      <!-- Card Header -->
      <rect x="382" y="144" width="182" height="24" rx="6" fill="#ECFDF5" />
      <text x="392" y="160" font-size="11.5" font-weight="700" fill="#047857">🏋️ 每周三练 A/B · 默认独自训练</text>

      <rect x="572" y="144" width="194" height="24" rx="6" fill="url(#warmGrad)" stroke="#FDE68A" stroke-width="1" />
      <text x="582" y="160" font-size="11.5" font-weight="700" fill="#B45309">🔥 无热身不训练，无激活不训练</text>

      <!-- Warmup & Activation Row -->
      <rect x="382" y="176" width="472" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="396" y="194" font-size="12" font-weight="700" fill="#0F172A">先活动关节 + 第 1 项低疲劳激活（不计正式组、不练累）</text>
      <text x="396" y="211" font-size="11.5" fill="#475569">手臂前后绕环/屈伸手肘/手腕绕环各8次 → 轻重量试做8次先把轨迹找顺</text>

      <!-- Main Exercise Row + Solo Cues -->
      <rect x="382" y="226" width="472" height="156" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
      <text x="396" y="248" font-size="13" font-weight="700" fill="#0F172A">主项｜上斜哑铃卧推</text>
      <text x="536" y="248" font-size="12" font-weight="700" fill="#059669" class="font-mono">2～3组 × 8～12次 · 休 2分钟 · 留2～3次余力</text>

      <!-- Colloquial Cues from exercises/上斜哑铃卧推.md -->
      <text x="396" y="272" font-size="12" fill="#334155">• <tspan font-weight="700" fill="#0F172A">一句提醒：</tspan>两边一起慢慢落，别抬头、别扭腰，两只哑铃在顶端不用碰在一起</text>
      <text x="396" y="293" font-size="12" fill="#334155">• <tspan font-weight="700" fill="#0F172A">独自起落：</tspan>选自己能稳稳拿起和放回的重量，较低上斜角锁稳卡扣，手肘别横着架平</text>
      <text x="396" y="314" font-size="12" fill="#334155">• <tspan font-weight="700" fill="#0F172A">下放总晃试法：</tspan>换轻一档，下放时心里默数“一、二”，看两边能不能一起落稳</text>

      <!-- Verified Bilibili Link Row + Search Fallback Standard -->
      <rect x="396" y="326" width="444" height="24" rx="6" fill="url(#biliGrad)" stroke="#BAE6FD" stroke-width="1" />
      <text x="408" y="342" font-size="11.5" font-weight="700" fill="#0369A1">▶ 谭成义视频｜B站教学（12:25起）  ·  无直达片段统一配：B站搜索｜动作名动作教学</text>

      <text x="396" y="370" font-size="11.5" font-weight="600" fill="#047857">💬 一次只聊透一个模块：“训练看完了，接下来想先看怎么吃，还是看补剂有没有必要？”</text>
    </g>

    <!-- ==========================================
         SCENE 2: CHINESE TAKEOUT + 3-TIER SUPPLEMENTS
         ========================================== -->
    <g class="scene-2">
      <!-- User Prompt Bubble -->
      <rect x="430" y="81" width="440" height="40" rx="14" fill="#047857" fill-opacity="0.14" />
      <rect x="428" y="78" width="442" height="40" rx="14" fill="url(#userBubbleGrad)" />
      <text x="446" y="103" font-size="12.5" font-weight="600" fill="#FFFFFF">“平时只点外卖怎么吃？另外我需要买蛋白粉、肌酸和氮泵吗？”</text>
    </g>

    <g class="card-2">
      <!-- Agent Response Card -->
      <rect x="366" y="130" width="504" height="264" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />

      <!-- Sub-card A: Chinese Takeout & Raw/Cooked Anchors -->
      <rect x="382" y="144" width="472" height="118" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect x="396" y="154" width="212" height="22" rx="5" fill="#ECFDF5" />
      <text x="404" y="169" font-size="11.5" font-weight="700" fill="#047857">🍱 外卖搭配 &amp; 中餐生熟重速查锚点</text>
      <text x="618" y="169" font-size="11" fill="#64748B">支持拍盒饭粗看搭配 · 不强制买秤</text>

      <text x="396" y="192" font-size="12" fill="#334155">• <tspan font-weight="700" fill="#0F172A">外卖直接点：</tspan>沙县鸡腿饭（去皮加青菜）、小碗菜（清蒸鱼/鸡肉+豆腐）、麻辣烫少喝汤</text>
      <text x="396" y="213" font-size="12" fill="#334155">• <tspan font-weight="700" fill="#0F172A">中餐换算准：</tspan><tspan font-weight="700" fill="#047857">100g生米≈250g熟饭</tspan>；1个带骨鸡腿去皮去骨≈<tspan font-weight="700" fill="#047857">80～100g熟净肉</tspan></text>
      <text x="396" y="234" font-size="11.5" fill="#64748B">• 不列普通食物永久禁食表，偶尔聚餐吃多了不用挨饿加练赎罪，下一顿正常吃就行</text>

      <!-- Sub-card B: 3-Tier Supplements -->
      <rect x="382" y="270" width="472" height="112" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
      <rect x="396" y="280" width="188" height="22" rx="5" fill="#ECFDF5" />
      <text x="404" y="295" font-size="11.5" font-weight="700" fill="#047857">💊 补剂三层评估（先帮你省钱）</text>
      <text x="594" y="295" font-size="11" fill="#64748B">看清产品标签 · 30g粉≠30g纯蛋白</text>

      <text x="396" y="318" font-size="12" fill="#334155">• <tspan font-weight="700" fill="#047857">必须：目前没有明确必补项。</tspan>三餐主食和肉蛋奶吃稳，不用先买一堆瓶瓶罐罐</text>
      <text x="396" y="339" font-size="12" fill="#334155">• <tspan font-weight="700" fill="#0F172A">可选：</tspan>蛋白粉（哪天外卖肉吃少了补1勺）、单水肌酸（规律练力量每天3～5g）</text>
      <text x="396" y="360" font-size="11.5" fill="#64748B">• <tspan font-weight="700" fill="#475569">特定情况再看：</tspan>长期几乎不晒太阳再看维D；不靠氮泵或高咖啡因硬顶日常疲劳</text>
    </g>

    <!-- ==========================================
         SCENE 3: SLEEP + 30-MIN FALLBACK + CONTINUATION
         ========================================== -->
    <g class="scene-3">
      <!-- User Prompt Bubble -->
      <rect x="424" y="81" width="446" height="40" rx="14" fill="#047857" fill-opacity="0.14" />
      <rect x="422" y="78" width="448" height="40" rx="14" fill="url(#userBubbleGrad)" />
      <text x="440" y="103" font-size="12.5" font-weight="600" fill="#FFFFFF">“昨晚没睡好，今天加班又只剩半小时怎么练？顺便整理份接续记录。”</text>
    </g>

    <g class="card-3">
      <!-- Agent Response Card -->
      <rect x="366" y="130" width="504" height="264" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />

      <!-- Sub-card A: 30-min Fallback & Sleep Recovery -->
      <rect x="382" y="144" width="472" height="114" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect x="396" y="154" width="218" height="22" rx="5" fill="#ECFDF5" />
      <text x="404" y="169" font-size="11.5" font-weight="700" fill="#047857">⚡ 半小时保底应变 &amp; 睡眠恢复联动</text>
      <text x="624" y="169" font-size="11" fill="#64748B">不设每日打卡 · 漏练不往次日硬叠</text>

